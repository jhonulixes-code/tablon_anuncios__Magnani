{% extends "base.html" %}
{% block content %}
<div class="row">
    <!-- Formulario para Publicar Anuncio -->
    <div class="col-md-4">
        <div class="card shadow-sm p-3">
            <h4>Nuevo Anuncio</h4>
            <form action="{{ url_for('anuncios.crear_anuncio') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" name="titulo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Usuario (Autor)</label>
                    <select name="usuario_id" class="form-control" required>
                        {% for u in usuarios %}
                        <option value="{{ u.id }}">{{ u.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select name="categoria_id" class="form-control" required>
                        {% for c in categorias %}
                        <option value="{{ c.id }}">{{ c.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-dark w-100">Publicar</button>
            </form>
        </div>
    </div>

    <!-- Tabla para Consultar y Eliminar Anuncios -->
    <div class="col-md-8">
        <div class="card shadow-sm p-3">
            <h4>Tablón de Anuncios</h4>
            <table class="table table-striped mt-2">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Descripción</th>
                        <th>Autor</th>
                        <th>Categoría</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    {% for a in anuncios %}
                    <tr>
                        <td>{{ a.titulo }}</td>
                        <td>{{ a.descripcion }}</td>
                        <td>{{ a.autor.nombre }}</td>
                        <td>{{ a.categoria.nombre }}</td>
                        <td>
                            <a href="{{ url_for('anuncios.eliminar_anuncio', id=a.id) }}" class="btn btn-danger btn-sm">Eliminar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
